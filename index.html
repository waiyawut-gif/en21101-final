<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>อ21101 ภาษาอังกฤษ 1 (Final) — Learning Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<style>
  :root {
    --maroon: #8B1E3F;
    --gold: #f1c76b;
    --cream: #FAF3E8;
    --ink: #3a2a1c;
    --muted: #a89a86;
    --border: #e8ddd0;
  }
  * { box-sizing: border-box; }
  body { background: var(--cream); font-family: 'Inter', 'Noto Sans Thai', sans-serif; color: var(--ink); margin: 0; }
  .font-display { font-family: 'Fredoka', 'Noto Sans Thai', sans-serif; }
  .font-thai { font-family: 'Noto Sans Thai', 'Inter', sans-serif; }

  /* ---------- Flip card ---------- */
  .flip-card { position: relative; width: 100%; height: 17rem; perspective: 1000px; cursor: pointer; }
  .flip-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
  }
  .flip-card.is-flipped .flip-card-inner { transform: rotateY(180deg); }
  .flip-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 1rem;
  }
  .flip-face.back { transform: rotateY(180deg); }
  .flip-face-inner {
    position: absolute;
    inset: 0;
    border-radius: 1rem;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .tab-btn.active { background: var(--maroon); color: white; }
  .tab-btn:not(.active) { color: #8a7a68; }
  .tab-btn:not(.active):hover { background: #fbeee0; }

  .vocab-unit-btn { background: white; color: #8a7a68; border: 1px solid var(--border); }
  .vocab-unit-btn.active { background: var(--maroon); color: white; border-color: var(--maroon); }
  .vocab-unit-btn:not(.active):hover { background: #fbeee0; }
  .vnav-title { color: var(--ink); }
  .vnav-sub { color: var(--muted); font-size: 0.72rem; }
  .vocab-unit-btn.active .vnav-title,
  .vocab-unit-btn.active .vnav-sub { color: white; }
  .vocab-unit-btn.active .vnav-icon { background: rgba(255,255,255,0.2) !important; }
  .vocab-unit-btn.active .vnav-icon i { color: white !important; }

  .accordion-icon { transition: transform 0.25s; }
  .accordion-icon.open { transform: rotate(180deg); }

  select { background-image: none; }

  [data-goto]:focus-visible {
    outline: 2px solid var(--maroon);
    outline-offset: 2px;
  }

  /* ---------- Game Styles ---------- */
  .match-card {
    transition: all 0.2s;
    cursor: pointer;
    user-select: none;
  }
  .match-card.selected {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
    transform: scale(0.95);
  }
  .match-card.matched {
    background: #4ade80; /* green */
    color: white;
    border-color: #4ade80;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.8);
    transition: all 0.5s;
  }
  .match-card.wrong {
    background: #f87171; /* red */
    color: white;
    border-color: #f87171;
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  /* ---------- Grammar Challenge ---------- */
  .quiz-option {
    transition: background-color 0.25s, border-color 0.25s, color 0.25s, transform 0.15s;
    text-align: left;
  }
  .quiz-option:not(:disabled):hover { border-color: var(--maroon); }
  .quiz-option.correct {
    background: #4ade80 !important;
    color: white !important;
    border-color: #4ade80 !important;
  }
  .quiz-option.wrong {
    background: #f87171 !important;
    color: white !important;
    border-color: #f87171 !important;
    animation: shake 0.4s;
  }
  .quiz-option:disabled { cursor: default; }

  .explain-box {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    margin-top: 0;
    transition: max-height 0.4s ease, opacity 0.35s ease, margin-top 0.4s ease;
  }
  .explain-box.show {
    max-height: 400px;
    opacity: 1;
    margin-top: 1rem;
  }

  .timer-bar-track { background: #f1e7d8; border-radius: 999px; overflow: hidden; height: 8px; }
  .timer-bar-fill { height: 100%; background: var(--gold); transition: width 1s linear, background-color 0.3s; border-radius: 999px; }
  .timer-bar-fill.urgent { background: #f87171; }

  .boss-hp-track { background: #f1e7d8; border-radius: 999px; overflow: hidden; height: 14px; }
  .boss-hp-fill { height: 100%; background: linear-gradient(90deg, var(--maroon), #b8385f); transition: width 0.6s ease; border-radius: 999px; }

  .heart-icon { transition: transform 0.3s, opacity 0.3s; }
  .heart-icon.lost { opacity: 0.25; transform: scale(0.8); }

  .combo-popup {
    position: absolute;
    top: -0.5rem;
    right: 0.5rem;
    background: var(--gold);
    color: var(--ink);
    font-weight: 700;
    font-size: 0.75rem;
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    opacity: 0;
    transform: translateY(6px) scale(0.9);
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .combo-popup.show { opacity: 1; transform: translateY(-4px) scale(1); }

  .boss-shake { animation: shake 0.4s; }

  /* ---------- Login screen ---------- */
  #login-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  #login-screen.hidden { display: none; }
  .login-input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 0.65rem 0.9rem;
    font-size: 0.9rem;
    outline: none;
    background: white;
  }
  .login-input:focus { border-color: var(--maroon); }
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="login-screen">
  <div class="bg-white rounded-3xl shadow-sm p-6 sm:p-8 w-full max-w-sm" style="border:1px solid var(--border);">
    <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-4" style="background: var(--maroon);">
      <i data-lucide="graduation-cap" class="w-6 h-6 text-white"></i>
    </div>
    <h1 class="font-thai font-bold text-lg mb-1">อ21101 ภาษาอังกฤษ 1</h1>
    <p class="font-thai text-xs mb-5" style="color:var(--muted);">กรอกข้อมูลของคุณก่อนเริ่มเรียนนะครับ/ค่ะ</p>

    <form id="login-form" class="flex flex-col gap-3">
      <div>
        <label class="font-thai text-xs font-semibold block mb-1" style="color:var(--ink);">ชื่อ - นามสกุล</label>
        <input type="text" id="login-name" class="login-input font-thai" placeholder="เช่น สมหญิง ใจดี" required>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="font-thai text-xs font-semibold block mb-1" style="color:var(--ink);">ชั้น</label>
          <input type="text" id="login-class" class="login-input font-thai" placeholder="เช่น ม.1/3" required>
        </div>
        <div>
          <label class="font-thai text-xs font-semibold block mb-1" style="color:var(--ink);">เลขที่</label>
          <input type="number" min="1" id="login-number" class="login-input" placeholder="เช่น 12" required>
        </div>
      </div>
      <button type="submit" id="login-submit" class="mt-2 w-full py-3 rounded-xl text-white font-semibold flex items-center justify-center gap-2 hover:opacity-90 transition" style="background:var(--maroon);">
        <i data-lucide="log-in" class="w-4 h-4"></i> เข้าสู่บทเรียน
      </button>
      <p id="login-error" class="text-xs text-red-500 hidden"></p>
    </form>
  </div>
</div>

<header class="sticky top-0 z-20" style="background: rgba(250,243,232,0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border);">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-3">
    <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background: var(--maroon);">
      <i data-lucide="graduation-cap" class="w-5 h-5 text-white"></i>
    </div>
    <div class="min-w-0 flex-1">
      <div class="font-thai font-semibold text-sm truncate" id="course-name"></div>
      <div class="font-thai text-[11px] truncate" style="color: var(--muted);" id="course-school"></div>
    </div>
    <button id="student-badge" class="hidden items-center gap-2 px-3 py-1.5 rounded-xl flex-shrink-0" style="background:#fbeee0;" title="เปลี่ยนผู้ใช้">
      <i data-lucide="user-round" class="w-3.5 h-3.5" style="color:var(--maroon);"></i>
      <span id="student-badge-name" class="font-thai text-xs font-semibold truncate max-w-[100px]" style="color:var(--ink);"></span>
    </button>
  </div>
  <div class="max-w-4xl mx-auto px-4 sm:px-6 pb-3">
    <div class="grid grid-cols-5 gap-1.5 bg-white rounded-2xl p-1.5" style="border: 1px solid var(--border);">
      <button class="tab-btn active flex items-center justify-center gap-1.5 rounded-xl py-2 text-sm font-semibold transition" data-tab="home">
        <i data-lucide="home" class="w-4 h-4"></i><span class="hidden sm:inline">Home</span>
      </button>
      <button class="tab-btn flex items-center justify-center gap-1.5 rounded-xl py-2 text-sm font-semibold transition" data-tab="grammar">
        <i data-lucide="book-open" class="w-4 h-4"></i><span class="hidden sm:inline">Grammar</span>
      </button>
      <button class="tab-btn flex items-center justify-center gap-1.5 rounded-xl py-2 text-sm font-semibold transition" data-tab="vocabulary">
        <i data-lucide="layers" class="w-4 h-4"></i><span class="hidden sm:inline">Vocabulary</span>
      </button>
      <!-- เพิ่มแท็บ Games -->
      <button class="tab-btn flex items-center justify-center gap-1.5 rounded-xl py-2 text-sm font-semibold transition" data-tab="quiz">
        <i data-lucide="gamepad-2" class="w-4 h-4"></i><span class="hidden sm:inline">Games</span>
      </button>
      <!-- เพิ่มแท็บ Admin -->
      <button class="tab-btn flex items-center justify-center gap-1.5 rounded-xl py-2 text-sm font-semibold transition" data-tab="admin">
        <i data-lucide="shield-check" class="w-4 h-4"></i><span class="hidden sm:inline">Admin</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 pb-16">
  <section id="tab-home" class="space-y-6"></section>
  <section id="tab-grammar" class="space-y-4 hidden"></section>
  <section id="tab-vocabulary" class="space-y-5 hidden"></section>
  <section id="tab-quiz" class="space-y-5 hidden"></section>
  <section id="tab-admin" class="space-y-5 hidden"></section>
</main>

<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
